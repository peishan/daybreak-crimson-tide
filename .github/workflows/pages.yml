name: Deploy static site to Pages

on:
  push:
    branches: [ main ]   # change if your default branch is different

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # San generates comic chapter art as PNG/JPG and uploads it straight
      # into assets/comics/<arc>/ with the same filename the game's own
      # chapter data already expects (just a different extension) -- no
      # format conversion on her end. This step auto-converts any such
      # file this push added or changed into the matching .webp the game
      # actually references (WebP compresses this painterly/AI-generated
      # art far better than PNG: ~87% smaller with no visible quality loss
      # at phone-screen size -- see the Comic Archive loading-speed fix),
      # removes the original, and commits the result back to this same
      # branch before the deploy below runs, so the freshly-converted art
      # ships in this same deploy rather than waiting for a second push.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Convert new/changed comic art to WebP
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'EOF'
          import subprocess, os
          from PIL import Image

          before = os.environ.get('BEFORE_SHA', '')
          if before and before != '0' * 40:
              diff = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=ACMR', before, 'HEAD'],
                  capture_output=True, text=True
              ).stdout.splitlines()
          else:
              # First push on a new branch, or a force-push with no usable
              # "before" -- fall back to just the files in the latest commit.
              diff = subprocess.run(
                  ['git', 'show', '--name-only', '--diff-filter=ACMR', '--pretty=', 'HEAD'],
                  capture_output=True, text=True
              ).stdout.splitlines()

          targets = [
              f for f in diff
              if f.startswith('assets/comics/')
              and f.lower().endswith(('.png', '.jpg', '.jpeg'))
              and os.path.isfile(f)
          ]
          if not targets:
              print('No new comic PNG/JPG art to convert.')
          for f in targets:
              im = Image.open(f)
              if im.mode in ('RGBA', 'LA') or (im.mode == 'P' and 'transparency' in im.info):
                  im = im.convert('RGBA')
              else:
                  im = im.convert('RGB')
              out = os.path.splitext(f)[0] + '.webp'
              im.save(out, 'WEBP', quality=82, method=5)
              os.remove(f)
              print(f'Converted {f} -> {out}')
          EOF

      - name: Commit converted art, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/comics/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-convert new comic art to WebP"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # root folder (where index.html lives)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
